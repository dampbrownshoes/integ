# Lullaby Email Campaign Configuration
# 🌙 Configuration file for gentle email notifications 🌙

# Email Service Settings (for future integration)
EMAIL_SERVICE="gentle_smtp"
SMTP_HOST="mail.peaceful-dreams.com"
SMTP_PORT="587"
SMTP_USERNAME=""
SMTP_PASSWORD=""

# Default Settings
DEFAULT_FROM_EMAIL="noreply@peaceful-integrations.com"
DEFAULT_FROM_NAME="Sweet Dreams Integration System"

# Template Settings
TEMPLATE_ENCODING="utf-8"
DEFAULT_LANGUAGE="lullaby_english"

# Logging
LOG_LEVEL="peaceful"
LOG_SENT_EMAILS="true"
LOG_FILE_MAX_SIZE="10MB"

# Gentle Rate Limiting
MAX_EMAILS_PER_HOUR="50"
PEACEFUL_DELAY_BETWEEN_EMAILS="30s"

# Personalization
ENABLE_LULLABY_PERSONALIZATION="true"
TIME_OF_DAY_ADJUSTMENTS="true"

# Signature
SYSTEM_SIGNATURE="✨ Sweet dreams from your Integration System ✨"